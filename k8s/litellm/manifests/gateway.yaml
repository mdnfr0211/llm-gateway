---
apiVersion: gateway.k8s.aws/v1beta1
kind: TargetGroupConfiguration
metadata:
  name: litellm-tgconfig
  namespace: litellm
spec:
  targetReference:
    name: litellm
    kind: Service
  defaultConfiguration:
    targetType: ip
---
apiVersion: gateway.k8s.aws/v1beta1
kind: LoadBalancerConfiguration
metadata:
  name: litellm-lb-config
  namespace: litellm
spec:
  scheme: internet-facing
  ipAddressType: ipv4
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: litellm-gateway
  namespace: litellm
spec:
  gatewayClassName: amazon-alb
  infrastructure:
    parametersRef:
      kind: LoadBalancerConfiguration
      name: litellm-lb-config
      group: gateway.k8s.aws
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: litellm-route
  namespace: litellm
spec:
  parentRefs:
    - name: litellm-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: litellm
          port: 4000
