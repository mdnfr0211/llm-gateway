serviceAccount:
  create: true
  name: litellm

replicaCount: 1

image:
  repository: ghcr.io/berriai/litellm-database
  tag: "v1.86.2"

service:
  type: ClusterIP
  port: 4000

extraEnvVars:
  - name: LITELLM_MASTER_KEY
    valueFrom:
      secretKeyRef:
        name: litellm-secrets
        key: LITELLM_MASTER_KEY
  - name: AWS_DEFAULT_REGION
    value: "ap-southeast-1"
  - name: LANGFUSE_PUBLIC_KEY
    valueFrom:
      secretKeyRef:
        name: litellm-secrets
        key: LANGFUSE_PUBLIC_KEY
  - name: LANGFUSE_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: litellm-secrets
        key: LANGFUSE_SECRET_KEY
  - name: LANGFUSE_HOST
    value: "http://langfuse-web.langfuse.svc.cluster.local:3000"

db:
  useExisting: true
  deployStandalone: false
  endpoint: litellm-eks-db.c1ckq8gqkas8.ap-southeast-1.rds.amazonaws.com
  database: litellm
  secret:
    name: litellm-secrets
    usernameKey: username
    passwordKey: password

proxy_config:
  model_list:
    - model_name: amazon-nova-lite-2
      litellm_params:
        model: bedrock/global.amazon.nova-2-lite-v1:0
        aws_region_name: ap-southeast-1

  litellm_settings:
    drop_params: true
    set_verbose: false
    num_retries: 3
    request_timeout: 120
    store_model_in_db: true
    callbacks: ["prometheus", "langfuse"]
    require_auth_for_metrics_endpoint: false

  general_settings:
    master_key: os.environ/LITELLM_MASTER_KEY

  guardrails:
    - guardrail_name: "content-filter"
      litellm_params:
        guardrail: litellm_content_filter
        mode: pre_call
        categories:
          - category: "harmful_self_harm"
            enabled: true
            action: "BLOCK"
            severity_threshold: "medium"
          - category: "harmful_violence"
            enabled: true
            action: "BLOCK"
            severity_threshold: "medium"
          - category: "harmful_illegal_weapons"
            enabled: true
            action: "BLOCK"
            severity_threshold: "medium"
        patterns:
          - pattern_type: "prebuilt"
            pattern_name: "email"
            action: "MASK"
          - pattern_type: "prebuilt"
            pattern_name: "sg_phone"
            action: "MASK"
          - pattern_type: "prebuilt"
            pattern_name: "sg_nric"
            action: "BLOCK"
          - pattern_type: "prebuilt"
            pattern_name: "sg_postal_code"
            action: "MASK"
          - pattern_type: "prebuilt"
            pattern_name: "passport_singapore"
            action: "BLOCK"
          - pattern_type: "prebuilt"
            pattern_name: "sg_uen"
            action: "MASK"
          - pattern_type: "prebuilt"
            pattern_name: "sg_bank_account"
            action: "BLOCK"
          - pattern_type: "prebuilt"
            pattern_name: "aws_access_key"
            action: "BLOCK"
          - pattern_type: "prebuilt"
            pattern_name: "aws_secret_key"
            action: "BLOCK"
          - pattern_type: "prebuilt"
            pattern_name: "github_token"
            action: "BLOCK"

resources:
  requests:
    cpu: 0.5
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 2Gi

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "4000"
  prometheus.io/path: "/metrics"

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70

nodeSelector:
  workload: litellm

tolerations:
  - key: workload
    operator: Equal
    value: litellm
    effect: NoSchedule

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: litellm-helm
